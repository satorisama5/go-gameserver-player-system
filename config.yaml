server:
  tcp_port: 8888
  grpc_port: 9090
  ws_proxy_port: 8889
  instance_id: ""            # 可留空，留空时默认使用 ip:port
  route_ttl_seconds: 30      # 用户路由在 Redis 中的TTL（秒）
  forward_listen_addr: ":18080"      # 实例内部转发HTTP监听地址
  forward_public_addr: "127.0.0.1:18080" # 其他实例可访问到本实例的转发地址
  max_connections: 20000 # 为“限制连接数”功能预留
  max_packets_per_second: 30   # 【新增】每秒允许接收的最大包数量

  max_player_speed: 150.0
  spawn_point:
    x: -613.0
    y: 99.0
    z: 0.0

database:
  mongo_uri: "mongodb://localhost:27017"

cache:
  redis_addr: "127.0.0.1:6379"

log:
  level: "debug"

aoi:
  grid_size: 50

mq:
  url: "amqp://guest:guest@localhost:5672/"
  room_queue_name: "room_chat_logs"
  private_queue_name: "private_chat_logs"

# event_logs 智能分析：按窗聚合落库 + 简单告警日志 + 只读 HTTP（默认仅本机）
event_log_analytics:
  enabled: true
  listen_addr: "127.0.0.1:19090"
  rollup_interval_seconds: 60
  alert_interval_seconds: 300

