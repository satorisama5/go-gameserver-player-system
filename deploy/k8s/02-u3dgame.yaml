# 使用 Docker Hub 真实镜像部署 gamed（演示 CI→仓库→K8s 闭环）
# 默认 tag 用 latest；可追溯部署时改成 CI 产出的 commit sha，例如 9563d35
# 有状态房间服演示用 replicas: 1（多副本需粘性会话/分片，面试可口头说明）
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: u3dgame
  labels:
    app: u3dgame
spec:
  replicas: 1
  selector:
    matchLabels:
      app: u3dgame
  template:
    metadata:
      labels:
        app: u3dgame
    spec:
      # 等依赖就绪再启动，避免 mongo 未监听就 dial refused 直接退出
      initContainers:
        - name: wait-mongo
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z mongo 27017; do echo waiting mongo; sleep 2; done"]
        - name: wait-redis
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z redis 6379; do echo waiting redis; sleep 2; done"]
        - name: wait-rabbitmq
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z rabbitmq 5672; do echo waiting rabbitmq; sleep 2; done"]
      containers:
        - name: u3dgame
          image: engetsu/u3dgame:e560729
          imagePullPolicy: Always
          ports:
            - name: tcp
              containerPort: 8888
            - name: grpc
              containerPort: 9090
          env:
            # 与 docker-compose / viper AutomaticEnv 对齐
            - name: DATABASE_MONGO_URI
              value: mongodb://mongo:27017
            - name: CACHE_REDIS_ADDR
              value: redis:6379
            - name: MQ_URL
              value: amqp://guest:guest@rabbitmq:5672/
            - name: SERVER_TCP_PORT
              value: "8888"
            - name: SERVER_GRPC_PORT
              value: "9090"
            - name: SERVER_FORWARD_PUBLIC_ADDR
              value: u3dgame:18080
            - name: SERVER_TCP_PUBLIC_ADDR
              value: "127.0.0.1:30888"
          readinessProbe:
            tcpSocket:
              port: 8888
            initialDelaySeconds: 8
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 8888
            initialDelaySeconds: 30
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: u3dgame
spec:
  type: NodePort
  selector:
    app: u3dgame
  ports:
    - name: tcp
      port: 8888
      targetPort: 8888
      nodePort: 30888
    - name: grpc
      port: 9090
      targetPort: 9090
      nodePort: 30909
