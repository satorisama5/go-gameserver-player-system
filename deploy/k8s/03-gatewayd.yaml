# 可选：gatewayd 也从 Hub 拉
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: u3dgatewayd
  labels:
    app: u3dgatewayd
spec:
  replicas: 1
  selector:
    matchLabels:
      app: u3dgatewayd
  template:
    metadata:
      labels:
        app: u3dgatewayd
    spec:
      containers:
        - name: u3dgatewayd
          image: engetsu/u3dgatewayd:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: GRPC_BACKEND_HOST
              value: u3dgame:9090
---
apiVersion: v1
kind: Service
metadata:
  name: u3dgatewayd
spec:
  type: NodePort
  selector:
    app: u3dgatewayd
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30808
