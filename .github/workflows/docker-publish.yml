# push 到 main（或手动 Run workflow）时：构建镜像并推到 Docker Hub
# 需在 GitHub 仓库 Settings → Secrets 配置：
#   DOCKERHUB_USERNAME
#   DOCKERHUB_TOKEN
name: Build and push Docker images

on:
  push:
    branches: [main, upgrade-2026]
  workflow_dispatch:

env:
  # 推送后镜像名：docker.io/<DOCKERHUB_USERNAME>/<name>:<tag>
  # 与 Docker Hub 仓库 engetsu/u3dgame、engetsu/u3dgatewayd 对齐
  IMAGE_GAMED: u3dgame
  IMAGE_GATEWAYD: u3dgatewayd

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata (gamed)
        id: meta_gamed
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_GAMED }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest

      - name: Build and push gamed
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.gamed
          push: true
          tags: ${{ steps.meta_gamed.outputs.tags }}
          labels: ${{ steps.meta_gamed.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract metadata (gatewayd)
        id: meta_gatewayd
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_GATEWAYD }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest

      - name: Build and push gatewayd
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.gatewayd
          push: true
          tags: ${{ steps.meta_gatewayd.outputs.tags }}
          labels: ${{ steps.meta_gatewayd.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
