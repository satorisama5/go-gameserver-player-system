# push 到 main / upgrade-2026：构建镜像推 Docker Hub，并回写 deploy/k8s 镜像 tag（供 ArgoCD 同步）
# Secrets: DOCKERHUB_USERNAME, DOCKERHUB_TOKEN
name: Build and push Docker images

on:
  push:
    branches: [main, upgrade-2026]
  workflow_dispatch:

env:
  IMAGE_GAMED: u3dgame
  IMAGE_GATEWAYD: u3dgatewayd

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 回写 commit 需要完整权限推同一分支
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Short SHA
        id: vars
        run: echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Extract metadata (gamed)
        id: meta_gamed
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_GAMED }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest

      - name: Build and push gamed
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.gamed
          push: true
          tags: ${{ steps.meta_gamed.outputs.tags }}
          labels: ${{ steps.meta_gamed.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract metadata (gatewayd)
        id: meta_gatewayd
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_GATEWAYD }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest

      - name: Build and push gatewayd
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.gatewayd
          push: true
          tags: ${{ steps.meta_gatewayd.outputs.tags }}
          labels: ${{ steps.meta_gatewayd.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # GitOps：把 K8s 清单里的镜像钉到本次构建的 short SHA，ArgoCD 盯 Git 变化后自动同步
      - name: Bump K8s image tags in repo
        run: |
          set -e
          SHA="${{ steps.vars.outputs.short_sha }}"
          USER="${{ secrets.DOCKERHUB_USERNAME }}"
          sed -i "s|image: ${USER}/u3dgame:.*|image: ${USER}/u3dgame:${SHA}|" deploy/k8s/02-u3dgame.yaml
          sed -i "s|image: ${USER}/u3dgatewayd:.*|image: ${USER}/u3dgatewayd:${SHA}|" deploy/k8s/03-gatewayd.yaml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deploy/k8s/02-u3dgame.yaml deploy/k8s/03-gatewayd.yaml
          if git diff --staged --quiet; then
            echo "image tags already up to date"
            exit 0
          fi
          git commit -m "chore: bump k8s images to ${SHA} [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
